<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Regenerative braking system">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1726"/><stop offset="1" stop-color="#0a0e16"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="50%" r="55%">
      <stop offset="0" stop-color="#38e1ff" stop-opacity="0.16"/><stop offset="1" stop-color="#38e1ff" stop-opacity="0"/>
    </radialGradient>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#ffb22e"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="url(#g)"/>
  <g stroke="#7d9ec0" stroke-opacity="0.07">
    <path d="M0 50H640M0 100H640M0 150H640M0 200H640M0 250H640M0 300H640M0 350H640"/>
    <path d="M53 0V400M107 0V400M160 0V400M213 0V400M267 0V400M320 0V400M373 0V400M427 0V400M480 0V400M533 0V400M587 0V400"/>
  </g>
  <rect width="640" height="400" fill="url(#glow)"/>
  <text x="34" y="52" font-family="monospace" font-size="15" letter-spacing="2" fill="#38e1ff">REGEN BRAKING</text>
  <text x="34" y="78" font-family="monospace" font-size="12" fill="#7c8aa3">Modular front-wheel · energy recovery</text>

  <!-- wheel -->
  <g transform="translate(452 210)">
    <circle r="118" fill="none" stroke="#38e1ff" stroke-opacity="0.85" stroke-width="6"/>
    <circle r="104" fill="none" stroke="#38e1ff" stroke-opacity="0.25" stroke-width="2"/>
    <g stroke="#9aa7bd" stroke-opacity="0.45" stroke-width="2">
      <line x1="0" y1="0" x2="0" y2="-104"/><line x1="0" y1="0" x2="0" y2="104"/>
      <line x1="0" y1="0" x2="-104" y2="0"/><line x1="0" y1="0" x2="104" y2="0"/>
      <line x1="0" y1="0" x2="74" y2="-74"/><line x1="0" y1="0" x2="-74" y2="-74"/>
      <line x1="0" y1="0" x2="74" y2="74"/><line x1="0" y1="0" x2="-74" y2="74"/>
    </g>
    <circle r="20" fill="#0f1726" stroke="#ffb22e" stroke-width="3"/>
    <circle r="5" fill="#ffb22e"/>
    <!-- recovery arc arrow -->
    <path d="M132 -22 A134 134 0 0 1 96 92" fill="none" stroke="#ffb22e" stroke-width="4" marker-end="url(#ah)"/>
  </g>

  <!-- energy / battery indicator -->
  <g transform="translate(34 150)">
    <text x="0" y="0" font-family="monospace" font-size="11" fill="#7c8aa3">ENERGY RECOVERED</text>
    <rect x="0" y="14" width="190" height="22" rx="4" fill="none" stroke="#7d9ec0" stroke-opacity="0.4"/>
    <rect x="190" y="20" width="7" height="10" rx="2" fill="#7d9ec0" fill-opacity="0.5"/>
    <rect x="5" y="19" width="40" height="12" rx="2" fill="#ffb22e"/>
    <rect x="49" y="19" width="40" height="12" rx="2" fill="#ffb22e"/>
    <rect x="93" y="19" width="40" height="12" rx="2" fill="#ffb22e" fill-opacity="0.55"/>
    <rect x="137" y="19" width="40" height="12" rx="2" fill="#ffb22e" fill-opacity="0.2"/>
  </g>

  <text x="34" y="360" font-family="monospace" font-size="12" fill="#38e1ff">&lt;/&gt; Fusion 360 · SolidWorks · ANSYS</text>
</svg>
