<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Swarit's Workout Routine</title>
<meta name="theme-color" content="#0A0B0C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Swarit PPL">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
  :root {
    --bg: #0A0B0C;
    --surface: #131517;
    --surface-2: #1B1E21;
    --line: #262A2E;
    --text: #F2F5F6;
    --text-2: #98A3A8;
    --text-3: #5E686D;
    --blue: #3B8EF0;
    --blue-dim: #17324F;
    --up: #35C07A;
    --up-dim: #143224;
    --hold: #D9A62B;
    --display: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    --mono: ui-monospace, 'SF Mono', 'Roboto Mono', Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--display); font-size: 15px; line-height: 1.4;
    padding-bottom: 108px;
  }
  .wrap { max-width: 620px; margin: 0 auto; padding: 0 12px; }

  /* ---------- header ---------- */
  .top {
    position: sticky; top: 0; z-index: 40; background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .toprow {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 12px 10px; max-width: 620px; margin: 0 auto;
  }
  .clock {
    font-family: var(--mono); font-size: 19px; font-weight: 700;
    font-variant-numeric: tabular-nums; letter-spacing: -.01em;
  }
  .clock.off { color: var(--text-3); }
  .divider { width: 1px; height: 18px; background: var(--line); }
  .setcount { font-family: var(--mono); font-size: 13px; color: var(--text-2); }
  .setcount b { color: var(--text); font-weight: 700; }
  .endbtn {
    margin-left: auto; background: var(--surface-2); border: 1px solid var(--line);
    color: var(--text); font-family: var(--display); font-size: 13px; font-weight: 600;
    padding: 9px 15px; border-radius: 20px; cursor: pointer;
  }
  .endbtn.primary { background: var(--blue); border-color: var(--blue); color: #061018; }
  .endbtn:disabled { opacity: .45; cursor: not-allowed; }

  .progress { height: 2px; background: var(--line); }
  .progress > div { height: 100%; background: var(--blue); width: 0; transition: width .25s; }

  .apptitle {
    max-width: 620px; margin: 0 auto; padding: 9px 12px 0;
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .16em;
    text-transform: uppercase; color: var(--text-3);
  }
  .tabs { display: flex; gap: 6px; padding: 8px 12px 11px; max-width: 620px; margin: 0 auto; }
  .tab {
    flex: 1; background: var(--surface); border: 1px solid var(--line); color: var(--text-2);
    font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: .1em;
    text-transform: uppercase; padding: 9px 4px; border-radius: 18px; cursor: pointer;
  }
  .tab[aria-selected="true"] { background: var(--text); border-color: var(--text); color: var(--bg); font-weight: 700; }
  .tab:focus-visible, .endbtn:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

  /* ---------- exercise ---------- */
  .series {
    font-family: var(--mono); font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
    color: var(--text-3); margin: 20px 0 7px;
  }
  .exhead { display: flex; align-items: flex-start; gap: 11px; }
  .exname { word-break: break-word; }
  .exname { font-size: 19px; font-weight: 700; letter-spacing: -.02em; margin: 0; }
  .exspec { font-family: var(--mono); font-size: 11.5px; color: var(--text-3); margin-top: 3px; }
  .swapbtn {
    flex: none; width: 40px; height: 40px; border-radius: 50%;
    background: var(--surface); border: 1px solid var(--line); color: var(--text-2);
    font-size: 17px; line-height: 1; cursor: pointer; margin-top: 2px;
  }
  .swapbtn.open { background: var(--blue); border-color: var(--blue); color: #04121F; }
  .swapbtn:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .swappanel {
    margin-top: 10px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 10px; padding: 6px; display: flex; flex-direction: column; gap: 2px;
  }
  .swapopt {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    width: 100%; text-align: left; background: transparent; border: 0; border-radius: 7px;
    color: var(--text-2); font-family: var(--display); font-size: 14px; font-weight: 500;
    padding: 11px 11px; cursor: pointer;
  }
  .swapopt.on { background: var(--blue-dim); color: var(--text); font-weight: 700; }
  .swapopt .deflab {
    font-family: var(--mono); font-size: 9px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--text-3);
  }
  .swapopt:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }
  .prevline {
    font-family: var(--mono); font-size: 12px; color: var(--text-2); margin-top: 6px;
    display: flex; flex-wrap: wrap; gap: 5px; align-items: center;
  }
  .prevlabel { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-3); }
  .pill { background: var(--surface-2); border-radius: 3px; padding: 2px 7px; color: var(--text-2); }
  .pill.none { color: var(--text-3); }

  /* ---------- set table ---------- */
  .thead {
    display: grid; grid-template-columns: 1fr 1fr 52px 46px; gap: 8px;
    padding: 14px 4px 6px; font-family: var(--mono); font-size: 10px;
    letter-spacing: .12em; text-transform: uppercase; color: var(--text-3);
  }
  .thead span:nth-child(1), .thead span:nth-child(2) { text-align: center; }
  .thead span:nth-child(3), .thead span:nth-child(4) { text-align: center; }

  .row {
    display: grid; grid-template-columns: 1fr 1fr 52px 46px; gap: 8px;
    align-items: center; padding: 6px 4px 6px 8px; border-left: 3px solid transparent;
    border-radius: 4px; margin-bottom: 4px;
  }
  .row.active { border-left-color: var(--blue); background: var(--surface); }
  .row.done { opacity: .55; }

  input.f {
    width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    color: var(--text); font-family: var(--mono); font-size: 17px; font-weight: 500;
    padding: 12px 6px; text-align: center; -moz-appearance: textfield;
  }
  input.f::-webkit-outer-spin-button, input.f::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input.f:focus { outline: none; border-color: var(--blue); }
  input.f::placeholder { color: var(--text-3); font-weight: 400; }
  .row.done input.f { border-color: transparent; background: transparent; }

  .restcell {
    font-family: var(--mono); font-size: 12.5px; color: var(--text-2); text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .restcell.counting { color: var(--blue); font-weight: 700; }

  .logit {
    width: 38px; height: 38px; margin: 0 auto; border-radius: 50%;
    border: 1.5px solid var(--text-3); background: transparent; color: var(--text-3);
    display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;
  }
  .logit svg { width: 17px; height: 17px; }
  .row.active .logit { border-color: var(--blue); color: var(--blue); }
  .logit.done { background: var(--up); border-color: var(--up); color: #06180E; }
  .logit.beat { box-shadow: 0 0 0 3px var(--up-dim); }
  .logit:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

  .rowbtns { display: flex; gap: 14px; padding: 4px 4px 0; }
  .link {
    background: none; border: 0; padding: 5px 0; cursor: pointer; color: var(--blue);
    font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
  }
  .link.quiet { color: var(--text-3); }

  .exdiv { height: 1px; background: var(--line); margin: 18px 0 0; }

  textarea.notes {
    width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    color: var(--text); font-family: var(--display); font-size: 14px; padding: 12px;
    margin-top: 20px; min-height: 76px; resize: vertical;
  }
  textarea.notes:focus { outline: none; border-color: var(--blue); }
  textarea.notes::placeholder { color: var(--text-3); }

  /* ---------- bottom bar ---------- */
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    background: rgba(10,11,12,.93); backdrop-filter: blur(10px);
    border-top: 1px solid var(--line);
    padding: 10px 12px calc(12px + env(safe-area-inset-bottom));
  }
  .bar-in { max-width: 620px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
  .resting { flex: 1; }
  .resting .rlabel {
    font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--text-3);
  }
  .resting .rtime {
    font-family: var(--mono); font-size: 26px; font-weight: 700; color: var(--blue);
    font-variant-numeric: tabular-nums; line-height: 1.05;
  }
  .skip {
    background: var(--surface-2); border: 1px solid var(--line); color: var(--text);
    font-family: var(--display); font-size: 13px; font-weight: 600; padding: 11px 16px;
    border-radius: 10px; cursor: pointer;
  }
  .go {
    flex: 1; border: 0; border-radius: 10px; background: var(--blue); color: #04121F;
    font-family: var(--display); font-size: 15px; font-weight: 700; padding: 15px 10px; cursor: pointer;
  }
  .go.save { background: var(--up); color: #04180D; }
  .go:disabled { background: var(--surface-2); color: var(--text-3); cursor: not-allowed; }

  /* ---------- history ---------- */
  .hcard { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 13px; margin-top: 10px; }
  .hhead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .hday { font-size: 15px; font-weight: 700; }
  .hmeta { font-family: var(--mono); font-size: 11px; color: var(--text-3); }
  .hline { font-family: var(--mono); font-size: 11.5px; color: var(--text-2); margin-top: 6px; }
  .hline b { color: var(--text); font-weight: 500; }
  .hnote { font-size: 13px; color: var(--text-2); font-style: italic; margin-top: 9px; }
  .empty { border: 1px dashed var(--line); border-radius: 10px; padding: 30px 20px; text-align: center; margin-top: 16px; }
  .empty h3 { margin: 0 0 6px; font-size: 16px; }
  .empty p { margin: 0; font-size: 13.5px; color: var(--text-2); }
  .sect { font-family: var(--mono); font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--text-3); margin: 24px 0 0; }

  .toast {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 100px; z-index: 60;
    background: var(--text); color: var(--bg); font-family: var(--mono); font-size: 12px;
    font-weight: 500; padding: 10px 15px; border-radius: 6px; opacity: 0;
    pointer-events: none; transition: opacity .18s;
  }
  .toast.show { opacity: 1; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="top">
  <div class="toprow">
    <div class="clock off" id="clock">0:00</div>
    <div class="divider"></div>
    <div class="setcount" id="setcount">Set <b>0</b>/0</div>
    <button class="endbtn" id="endBtn">End workout</button>
  </div>
  <div class="progress"><div id="progbar"></div></div>
  <div class="apptitle">Swarit&#8217;s Workout Routine</div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-view="push" aria-selected="true">Push</button>
    <button class="tab" role="tab" data-view="pull" aria-selected="false">Pull</button>
    <button class="tab" role="tab" data-view="legs" aria-selected="false">Legs</button>
    <button class="tab" role="tab" data-view="history" aria-selected="false">Log</button>
  </div>
</div>

<div class="wrap" id="main"></div>

<div class="bar" id="bar">
  <div class="bar-in" id="barIn"></div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  var PLAN = {
    push: { label: 'Push day', ex: [
      { id: 'p1', name: 'Smith machine incline press', sets: 4, spec: '3–4 × 8–10',
        alts: ['Barbell incline press', 'Incline DB press', 'Incline chest press machine'] },
      { id: 'p2', name: 'Hammer Strength flat press', sets: 3, spec: '3 × 8–10',
        alts: ['Flat DB press', 'Smith flat press', 'Machine chest press'] },
      { id: 'p3', name: 'Pec-deck fly', sets: 3, spec: '3 × 10–12',
        alts: ['Cable fly, high to low', 'Cable crossover', 'Incline DB fly'] },
      { id: 'p4', name: 'Machine or DB lateral raise', sets: 3, spec: '3 × 10–15 + partials',
        alts: ['DB lateral raise', 'Machine lateral raise', 'Leaning DB lateral raise'] },
      { id: 'p5', name: 'Behind-the-back cable lateral raise', sets: 2, spec: '2 × 12–15',
        alts: ['Neutral-grip lateral raise', 'Cable lateral raise across body', 'Cable Y-raise'] },
      { id: 'p6', name: 'Overhead rope or DB extension', sets: 3, spec: '3 × 10–12',
        alts: ['Two-hand overhead DB extension', 'EZ-bar skullcrusher', 'Single-arm overhead cable'] },
      { id: 'p7', name: 'Rope pushdown', sets: 3, spec: '3 × 10–15',
        alts: ['Straight-bar pushdown', 'Single-arm cable pushdown', 'Dip machine'] }
    ]},
    pull: { label: 'Pull day', ex: [
      { id: 'l1', name: 'Lat pulldown', sets: 4, spec: '3–4 × 8–12',
        alts: ['Neutral-grip pulldown', 'Assisted pull-up', 'Single-arm lat pulldown'] },
      { id: 'l2', name: 'Chest-supported row or T-bar row', sets: 4, spec: '3–4 × 8–12',
        alts: ['T-bar row', 'Chest-supported DB row', 'Machine row'] },
      { id: 'l3', name: 'Close-grip cable row', sets: 3, spec: '3 × 8–12',
        alts: ['Seated machine row', 'Single-arm DB row', 'Wide-grip cable row'] },
      { id: 'l4', name: 'Rear-delt fly', sets: 4, spec: '4 × 12–15',
        alts: ['Reverse pec-deck', 'Cable rear-delt fly', 'Chest-supported DB rear fly'] },
      { id: 'l5', name: 'Face pull + shrug', sets: 3, spec: '2–3 × 15–20 / 10–15',
        alts: ['Cable face pull only', 'Band pull-apart + shrug', 'DB shrug only'] },
      { id: 'l6', name: 'Hyperextension or half deadlift', sets: 3, spec: '3 × 8–12',
        alts: ['45° hyperextension', 'Half deadlift / rack pull', 'Light good morning'] },
      { id: 'l7', name: 'Incline DB curl', sets: 3, spec: '3 × 8–12',
        alts: ['Bayesian cable curl', 'Preacher curl', 'Standing DB curl'] },
      { id: 'l8', name: 'Hammer or reverse curl', sets: 3, spec: '2–3 × 10–12',
        alts: ['Rope hammer curl', 'Reverse EZ-bar curl', 'Cross-body hammer curl'] }
    ]},
    legs: { label: 'Legs day', ex: [
      { id: 'g1', name: 'Barbell heels-elevated squat', sets: 4, spec: '3–4 × 8–10',
        alts: ['Box squat', 'Hack squat', 'Smith heels-elevated squat', 'Leg press, both legs'] },
      { id: 'g2', name: 'Romanian deadlift', sets: 4, spec: '3–4 × 8–10',
        alts: ['DB Romanian deadlift', 'Cable pull-through', 'Light good morning'] },
      { id: 'g3', name: 'Leg press — one leg at a time', sets: 3, spec: '3 × 10–12 / leg',
        alts: ['Bulgarian split squat', 'Walking lunge', 'Single-leg hack squat'] },
      { id: 'g4', name: 'Lying or seated hamstring curl', sets: 3, spec: '3 × 10–15',
        alts: ['Seated hamstring curl', 'Lying hamstring curl', 'Assisted Nordic curl'] },
      { id: 'g5', name: 'Abductor + adductor machine', sets: 3, spec: '3 × 12–15',
        alts: ['Cable hip abduction', 'Banded lateral walk', 'Copenhagen plank'] },
      { id: 'g6', name: 'Seated calf raise', sets: 4, spec: '3–4 × 10–15',
        alts: ['Standing calf raise', 'Leg press calf raise', 'Single-leg calf raise'] },
      { id: 'g7', name: 'Machine crunches', sets: 3, spec: '3 × 12–20',
        alts: ['Cable crunch', 'Weighted decline crunch', 'Hanging knee raise'] },
      { id: 'g8', name: 'Leg raise + suitcase carry', sets: 3, spec: '2–3 × 10–15 / 30 s',
        alts: ['Hanging leg raise + carry', 'Captain\'s chair raise', 'Suitcase carry only'] }
    ]}
  };

  var SERIES = 'ABCDEFGHIJ';
  var REST_SET = 90, REST_EX = 180;
  var K_SESSIONS = 'ppl:sessions', K_DRAFT = 'ppl:draft';

  var state = { view: 'push', sessions: [], draft: null, saveTimer: null, storageOK: true, swapOpen: null };
  var rest = { left: 0, running: false, tick: null, mode: 'set', row: null };
  var clockTick = null;

  var main = document.getElementById('main');
  var toastEl = document.getElementById('toast');
  var clockEl = document.getElementById('clock');
  var setcountEl = document.getElementById('setcount');
  var progEl = document.getElementById('progbar');
  var barIn = document.getElementById('barIn');

  /* ---------- storage ---------- */
  var LS = (function () {
    try { var k = '__t'; window.localStorage.setItem(k, '1'); window.localStorage.removeItem(k); return window.localStorage; }
    catch (e) { return null; }
  })();

  function load(key, fb) {
    if (window.storage) {
      return window.storage.get(key).then(function (r) {
        if (!r || !r.value) return fb;
        try { return JSON.parse(r.value); } catch (e) { return fb; }
      }).catch(function () { return fb; });
    }
    if (LS) {
      try { var v = LS.getItem(key); return Promise.resolve(v ? JSON.parse(v) : fb); }
      catch (e) { return Promise.resolve(fb); }
    }
    return Promise.resolve(fb);
  }

  function save(key, val) {
    if (window.storage) {
      return window.storage.set(key, JSON.stringify(val)).catch(function () {
        state.storageOK = false; toast('Saving failed'); return null;
      });
    }
    if (LS) {
      try { LS.setItem(key, JSON.stringify(val)); } catch (e) { toast('Storage full'); }
      return Promise.resolve(null);
    }
    return Promise.resolve(null);
  }
  function toast(msg) {
    toastEl.textContent = msg; toastEl.classList.add('show');
    setTimeout(function () { toastEl.classList.remove('show'); }, 2100);
  }

  /* ---------- draft ---------- */
  function blankDraft(day) {
    var d = { day: day, started: null, notes: '', ex: {}, variant: {} };
    PLAN[day].ex.forEach(function (e) {
      d.ex[e.id] = [];
      for (var i = 0; i < e.sets; i++) d.ex[e.id].push({ w: '', r: '', done: false });
    });
    return d;
  }
  function ensureDraft(day) {
    if (!state.draft || state.draft.day !== day) state.draft = blankDraft(day);
    if (!state.draft.variant) state.draft.variant = {};
    PLAN[day].ex.forEach(function (e) {
      if (!Array.isArray(state.draft.ex[e.id])) {
        state.draft.ex[e.id] = [];
        for (var i = 0; i < e.sets; i++) state.draft.ex[e.id].push({ w: '', r: '', done: false });
      }
    });
    return state.draft;
  }
  function queueSave() {
    if (state.saveTimer) clearTimeout(state.saveTimer);
    state.saveTimer = setTimeout(function () { save(K_DRAFT, state.draft); }, 600);
  }

  /* ---------- history helpers ---------- */
  function num(v) { var n = parseFloat(v); return isNaN(n) ? null : n; }
  function setStr(s) { var w = num(s.w), r = num(s.r); return (w === null || r === null) ? null : w + '×' + r; }
  function fmtDate(ts) {
    return ts ? new Date(ts).toLocaleDateString(undefined, { day: '2-digit', month: 'short' }) : '';
  }
  function fmtDur(ms) {
    var s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.round((s % 3600) / 60);
    return h > 0 ? h + ' h ' + m + ' min' : m + ' min';
  }
  function defaultName(exId) {
    var e = findEx(exId);
    return e ? e.name : exId;
  }
  function variantOf(exId) {
    var d = state.draft;
    return (d && d.variant && d.variant[exId]) ? d.variant[exId] : defaultName(exId);
  }
  function sessionVariant(s, exId) {
    return (s.variant && s.variant[exId]) ? s.variant[exId] : defaultName(exId);
  }
  function lastSetsFor(exId, day) {
    var want = variantOf(exId);
    for (var i = state.sessions.length - 1; i >= 0; i--) {
      var s = state.sessions[i];
      if (s.day !== day) continue;
      if (sessionVariant(s, exId) !== want) continue;
      var a = s.ex && s.ex[exId];
      if (a && a.length) return { sets: a, when: s.finished || s.started };
    }
    return null;
  }
  function lastSessionFor(day) {
    for (var i = state.sessions.length - 1; i >= 0; i--) if (state.sessions[i].day === day) return state.sessions[i];
    return null;
  }
  function beatsPrev(cur, prev) {
    var cw = num(cur.w), cr = num(cur.r);
    if (cw === null || cr === null) return false;
    if (!prev) return false;
    var pw = num(prev.w), pr = num(prev.r);
    if (pw === null || pr === null) return false;
    return cw > pw || (cw === pw && cr > pr);
  }

  /* ---------- set counting ---------- */
  function totalSets(day) {
    var d = ensureDraft(day), n = 0;
    Object.keys(d.ex).forEach(function (k) { n += d.ex[k].length; });
    return n;
  }
  function doneSets(day) {
    var d = ensureDraft(day), n = 0;
    Object.keys(d.ex).forEach(function (k) {
      d.ex[k].forEach(function (s) { if (s.done) n++; });
    });
    return n;
  }
  function activeIndex(day) {
    var d = ensureDraft(day), plan = PLAN[day], idx = 0;
    for (var i = 0; i < plan.ex.length; i++) {
      var rows = d.ex[plan.ex[i].id];
      for (var j = 0; j < rows.length; j++) {
        if (!rows[j].done) return { ex: plan.ex[i].id, row: j, n: idx };
        idx++;
      }
    }
    return null;
  }
  function paintCounts() {
    if (state.view === 'history') return;
    var day = state.view, tot = totalSets(day), dn = doneSets(day);
    setcountEl.innerHTML = 'Set <b>' + Math.min(dn + 1, tot) + '</b>/' + tot;
    progEl.style.width = (tot ? (dn / tot) * 100 : 0) + '%';
  }

  /* ---------- clock ---------- */
  function paintClock() {
    if (state.view === 'history' || !state.draft || !state.draft.started) {
      clockEl.textContent = '0:00'; clockEl.classList.add('off'); return;
    }
    var s = Math.max(0, Math.floor((Date.now() - state.draft.started) / 1000));
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
    clockEl.textContent = (h > 0 ? h + ':' + String(m).padStart(2, '0') : String(m)) + ':' + String(ss).padStart(2, '0');
    clockEl.classList.remove('off');
  }
  function startClock() {
    if (clockTick) clearInterval(clockTick);
    clockTick = setInterval(paintClock, 1000); paintClock();
  }
  function stopClock() { if (clockTick) clearInterval(clockTick); clockTick = null; paintClock(); }

  /* ---------- rest ---------- */
  function startRest(mode, rowKey) {
    rest.mode = mode; rest.row = rowKey;
    rest.left = mode === 'exercise' ? REST_EX : REST_SET;
    rest.running = true;
    if (rest.tick) clearInterval(rest.tick);
    rest.tick = setInterval(function () {
      rest.left--;
      if (rest.left <= 0) { endRest(true); return; }
      paintBar(); paintRowRest();
    }, 1000);
    paintBar(); paintRowRest();
  }
  function endRest(fired) {
    if (rest.tick) clearInterval(rest.tick);
    rest.running = false; rest.left = 0;
    var wasEx = rest.mode === 'exercise';
    rest.row = null;
    paintBar(); paintRowRest();
    if (fired) toast(wasEx ? 'Rest done — next exercise' : 'Rest done — next set');
  }
  function mmss(n) { return Math.floor(n / 60) + ':' + String(n % 60).padStart(2, '0'); }
  function paintRowRest() {
    Array.prototype.forEach.call(main.querySelectorAll('.restcell'), function (c) {
      var key = c.getAttribute('data-rest');
      if (rest.running && key === rest.row) {
        c.textContent = mmss(rest.left); c.classList.add('counting');
      } else {
        c.textContent = c.getAttribute('data-default'); c.classList.remove('counting');
      }
    });
  }

  /* ---------- bottom bar ---------- */
  function paintBar() {
    if (state.view === 'history') { document.getElementById('bar').style.display = 'none'; return; }
    document.getElementById('bar').style.display = '';
    var started = state.draft && state.draft.started;

    if (rest.running) {
      barIn.innerHTML = '<div class="resting"><div class="rlabel">' +
        (rest.mode === 'exercise' ? 'Rest — next exercise' : 'Rest — next set') +
        '</div><div class="rtime">' + mmss(rest.left) + '</div></div>' +
        '<button class="skip" id="skipBtn">Skip rest</button>';
      document.getElementById('skipBtn').onclick = function () { endRest(false); };
      return;
    }
    if (!started) {
      barIn.innerHTML = '<button class="go" id="goBtn">Start workout</button>';
      document.getElementById('goBtn').onclick = beginSession;
      return;
    }
    var any = doneSets(state.view) > 0;
    barIn.innerHTML = '<button class="go save" id="goBtn"' + (any ? '' : ' disabled') + '>Save workout</button>';
    if (any) document.getElementById('goBtn').onclick = finishSession;
  }

  function beginSession() {
    var d = ensureDraft(state.view);
    d.started = Date.now();
    startClock(); queueSave(); render(); toast('Workout started');
  }

  function finishSession() {
    var d = state.draft;
    if (!d) return;
    var clean = { day: d.day, started: d.started || Date.now(), finished: Date.now(), notes: d.notes || '', ex: {}, variant: {} };
    Object.keys(d.variant || {}).forEach(function (k) { clean.variant[k] = d.variant[k]; });
    Object.keys(d.ex).forEach(function (k) {
      var rows = d.ex[k].filter(function (s) { return s.done && setStr(s); });
      if (rows.length) clean.ex[k] = rows.map(function (s) { return { w: s.w, r: s.r }; });
    });
    state.sessions.push(clean);
    save(K_SESSIONS, state.sessions);
    state.draft = null; save(K_DRAFT, null);
    stopClock(); endRest(false);
    toast('Saved — ' + fmtDur(clean.finished - clean.started));
    render();
  }

  document.getElementById('endBtn').addEventListener('click', function () {
    if (state.view === 'history') { setView('push'); return; }
    if (!state.draft || !state.draft.started) { toast('No workout running'); return; }
    if (this.dataset.armed) {
      delete this.dataset.armed; this.textContent = 'End workout'; this.classList.remove('primary');
      if (doneSets(state.view) > 0) finishSession();
      else { state.draft = null; save(K_DRAFT, null); stopClock(); endRest(false); toast('Workout discarded'); render(); }
    } else {
      this.dataset.armed = '1';
      this.textContent = doneSets(state.view) > 0 ? 'Save & end?' : 'Discard?';
      this.classList.add('primary');
      var b = this;
      setTimeout(function () {
        if (b.dataset.armed) { delete b.dataset.armed; b.textContent = 'End workout'; b.classList.remove('primary'); }
      }, 4000);
    }
  });

  /* ---------- render day ---------- */
  function checkSVG() {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
  }

  function render() {
    if (state.view === 'history') { renderHistory(); return; }
    var day = state.view, plan = PLAN[day], draft = ensureDraft(day);
    var act = activeIndex(day);
    var html = '';

    plan.ex.forEach(function (e, i) {
      var prev = lastSetsFor(e.id, day);
      var rows = draft.ex[e.id];

      var pills;
      if (prev) {
        var parts = prev.sets.map(setStr).filter(Boolean);
        pills = parts.map(function (p) { return '<span class="pill">' + p + '</span>'; }).join('') +
          '<span class="prevlabel">' + fmtDate(prev.when) + '</span>';
      } else {
        pills = '<span class="pill none">first time on this variation</span>';
      }

      var vName = variantOf(e.id);
      var swapped = vName !== e.name;
      var opts = [e.name].concat(e.alts || []);
      var open = state.swapOpen === e.id;

      var panel = '';
      if (open) {
        panel = '<div class="swappanel">' + opts.map(function (o) {
          return '<button class="swapopt' + (o === vName ? ' on' : '') + '" data-pick="' +
            e.id + '|' + esc(o) + '">' + esc(o) +
            (o === e.name ? '<span class="deflab">default</span>' : '') + '</button>';
        }).join('') + '</div>';
      }

      html += '<div class="series">' + SERIES[i] + ' Series</div>' +
        '<div class="exhead"><div style="flex:1"><h2 class="exname">' + esc(vName) + '</h2>' +
        '<div class="exspec">TARGET ' + e.spec + (swapped ? ' · SWAPPED' : '') + '</div>' +
        '<div class="prevline"><span class="prevlabel">Beat</span>' + pills + '</div></div>' +
        '<button class="swapbtn' + (open ? ' open' : '') + '" data-swap="' + e.id + '" aria-label="Swap exercise">⇅</button>' +
        '</div>' + panel +
        '<div class="thead"><span>Reps</span><span>Weight</span><span>Rest</span><span>Log it</span></div>';

      rows.forEach(function (s, j) {
        var isActive = act && act.ex === e.id && act.row === j;
        var isLast = j === rows.length - 1;
        var defRest = (isLast ? REST_EX : REST_SET) + 's';
        var pv = prev ? prev.sets[j] : null;
        var beat = s.done && beatsPrev(s, pv);
        html += '<div class="row' + (isActive ? ' active' : '') + (s.done ? ' done' : '') + '">' +
          '<input class="f" inputmode="numeric" data-ex="' + e.id + '" data-i="' + j + '" data-f="r" value="' + (s.r || '') + '" placeholder="' + (pv && num(pv.r) !== null ? pv.r : '—') + '" aria-label="Reps set ' + (j + 1) + '">' +
          '<input class="f" inputmode="decimal" data-ex="' + e.id + '" data-i="' + j + '" data-f="w" value="' + (s.w || '') + '" placeholder="' + (pv && num(pv.w) !== null ? pv.w + ' kg' : 'kg') + '" aria-label="Weight set ' + (j + 1) + '">' +
          '<div class="restcell" data-rest="' + e.id + '-' + j + '" data-default="' + defRest + '">' + defRest + '</div>' +
          '<button class="logit' + (s.done ? ' done' : '') + (beat ? ' beat' : '') + '" data-log="' + e.id + '-' + j + '" aria-label="Log set ' + (j + 1) + '">' + checkSVG() + '</button>' +
          '</div>';
      });

      html += '<div class="rowbtns"><button class="link" data-add="' + e.id + '">+ Add set</button>' +
        (rows.length > 1 ? '<button class="link quiet" data-del="' + e.id + '">Remove last</button>' : '') +
        '</div><div class="exdiv"></div>';
    });

    html += '<textarea class="notes" id="notes" placeholder="How it went — knee, energy, anything for next time">' + (draft.notes || '') + '</textarea>';
    var prevS = lastSessionFor(day);
    if (prevS && prevS.notes) {
      html += '<div class="sect">Last time you wrote</div><div class="hcard"><div class="hnote">' + esc(prevS.notes) + '</div></div>';
    }

    main.innerHTML = html;
    paintCounts(); paintBar(); paintRowRest();
    if (draft.started && !clockTick) startClock();
    paintClock();
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }

  /* ---------- interactions ---------- */
  main.addEventListener('input', function (ev) {
    if (state.view === 'history' || !state.draft) return;
    var t = ev.target;
    if (t.classList && t.classList.contains('f')) {
      var ex = t.getAttribute('data-ex'), i = +t.getAttribute('data-i'), f = t.getAttribute('data-f');
      if (!state.draft.ex[ex] || !state.draft.ex[ex][i]) return;
      state.draft.ex[ex][i][f] = t.value;
      queueSave();
    } else if (t.id === 'notes') {
      state.draft.notes = t.value; queueSave();
    }
  });

  main.addEventListener('click', function (ev) {
    if (state.view === 'history' || !state.draft) return;
    var btn = ev.target.closest ? ev.target.closest('[data-log],[data-add],[data-del],[data-swap],[data-pick]') : null;
    if (!btn) return;

    var logKey = btn.getAttribute('data-log');
    var add = btn.getAttribute('data-add');
    var del = btn.getAttribute('data-del');
    var swap = btn.getAttribute('data-swap');
    var pick = btn.getAttribute('data-pick');

    if (swap) {
      state.swapOpen = (state.swapOpen === swap) ? null : swap;
      render();
      return;
    }
    if (pick) {
      var bits = pick.split('|'), pid = bits[0], pname = bits.slice(1).join('|');
      var base = findEx(pid);
      if (base) {
        if (pname === base.name) delete state.draft.variant[pid];
        else state.draft.variant[pid] = pname;
      }
      state.swapOpen = null;
      queueSave(); render();
      toast('Swapped to ' + pname);
      return;
    }

    if (logKey) {
      var parts = logKey.split('-'), exId = parts[0], j = +parts[1];
      var row = state.draft.ex[exId][j];
      var inputs = main.querySelectorAll('[data-ex="' + exId + '"][data-i="' + j + '"]');
      Array.prototype.forEach.call(inputs, function (inp) {
        var f = inp.getAttribute('data-f');
        if (!inp.value && inp.placeholder && inp.placeholder !== '—' && inp.placeholder !== 'kg') {
          inp.value = parseFloat(inp.placeholder);
        }
        row[f] = inp.value;
      });
      if (!setStr(row)) { toast('Enter reps and weight first'); return; }

      row.done = !row.done;
      if (row.done) {
        if (!state.draft.started) { state.draft.started = Date.now(); startClock(); }
        var isLast = j === state.draft.ex[exId].length - 1;
        startRest(isLast ? 'exercise' : 'set', logKey);
      } else if (rest.row === logKey) {
        endRest(false);
      }
      queueSave(); render();
      return;
    }

    if (add) { state.draft.ex[add].push({ w: '', r: '', done: false }); queueSave(); render(); }
    if (del) { if (state.draft.ex[del].length > 1) state.draft.ex[del].pop(); queueSave(); render(); }
  });

  /* ---------- history ---------- */
  function renderHistory() {
    document.getElementById('bar').style.display = 'none';
    clockEl.textContent = '0:00'; clockEl.classList.add('off');
    setcountEl.innerHTML = '<b>' + state.sessions.length + '</b> saved';
    progEl.style.width = '0';

    if (!state.sessions.length) {
      main.innerHTML = '<div class="empty"><h3>Nothing logged yet</h3><p>Start a workout, tap the check on each set as you finish it, then save. From session two, the grey numbers in each box are what you did last time.</p></div>';
      return;
    }

    var html = '<div class="sect">Top set over time</div>';
    ['g1', 'p1', 'l1'].forEach(function (id) {
      var e = findEx(id), ser = topSeries(id);
      if (!e || ser.length < 2) return;
      html += '<div class="hcard"><div class="hhead"><div class="hday">' + e.name + '</div>' +
        '<div class="hmeta">' + ser[ser.length - 1] + ' kg</div></div>' + spark(ser) + '</div>';
    });

    html += '<div class="sect">Workouts</div>';
    for (var i = state.sessions.length - 1; i >= 0; i--) {
      var s = state.sessions[i], plan = PLAN[s.day];
      if (!plan) continue;
      var dur = (s.finished && s.started && s.finished > s.started) ? ' · ' + fmtDur(s.finished - s.started) : '';
      html += '<div class="hcard"><div class="hhead"><div class="hday">' + plan.label + '</div>' +
        '<div class="hmeta">' + fmtDate(s.finished || s.started) + dur + '</div></div>';
      plan.ex.forEach(function (e) {
        var rows = s.ex[e.id];
        if (!rows || !rows.length) return;
        var vn = sessionVariant(s, e.id);
        html += '<div class="hline">' + esc(vn) + ' &nbsp;<b>' + rows.map(setStr).filter(Boolean).join('  ') + '</b></div>';
      });
      if (s.notes) html += '<div class="hnote">' + esc(s.notes) + '</div>';
      html += '</div>';
    }

    html += '<div class="rowbtns" style="margin:18px 0 6px"><button class="link" id="expBtn">Copy all data</button>' +
      '<button class="link quiet" id="clrBtn">Erase everything</button></div>';

    main.innerHTML = html;

    document.getElementById('expBtn').onclick = function () {
      var txt = JSON.stringify(state.sessions);
      if (navigator.clipboard) navigator.clipboard.writeText(txt).then(function () { toast('Copied'); }, function () { toast('Copy failed'); });
      else toast('Copy not available here');
    };
    document.getElementById('clrBtn').onclick = function () {
      if (this.dataset.armed) {
        state.sessions = []; save(K_SESSIONS, []); state.draft = null; save(K_DRAFT, null);
        toast('Log erased'); renderHistory();
      } else { this.dataset.armed = '1'; this.textContent = 'Tap again to confirm'; }
    };
  }

  function findEx(id) {
    var out = null;
    Object.keys(PLAN).forEach(function (d) { PLAN[d].ex.forEach(function (e) { if (e.id === id) out = e; }); });
    return out;
  }
  function topSeries(id) {
    var out = [];
    state.sessions.forEach(function (s) {
      var rows = s.ex && s.ex[id];
      if (!rows || !rows.length) return;
      var best = 0;
      rows.forEach(function (r) { var w = num(r.w); if (w !== null && w > best) best = w; });
      if (best > 0) out.push(best);
    });
    return out;
  }
  function spark(vals) {
    var w = 280, h = 42, pad = 4;
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals), span = (max - min) || 1;
    var step = vals.length > 1 ? (w - pad * 2) / (vals.length - 1) : 0;
    var pts = vals.map(function (v, i) {
      return (pad + i * step).toFixed(1) + ',' + (h - pad - ((v - min) / span) * (h - pad * 2)).toFixed(1);
    }).join(' ');
    return '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" height="' + h + '" preserveAspectRatio="none" style="margin-top:8px;display:block" aria-hidden="true">' +
      '<polyline points="' + pts + '" fill="none" stroke="#3B8EF0" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>';
  }

  /* ---------- views ---------- */
  function setView(v) {
    state.view = v;
    Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (t) {
      t.setAttribute('aria-selected', t.getAttribute('data-view') === v ? 'true' : 'false');
    });
    render();
    window.scrollTo(0, 0);
  }
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (t) {
    t.addEventListener('click', function () { setView(t.getAttribute('data-view')); });
  });

  /* ---------- boot ---------- */
  Promise.all([load(K_SESSIONS, []), load(K_DRAFT, null)]).then(function (r) {
    state.sessions = Array.isArray(r[0]) ? r[0] : [];
    state.draft = r[1] && r[1].day ? r[1] : null;
    if (!window.storage && !LS) toast('This browser blocks storage — data will not be saved');
    setView(state.draft ? state.draft.day : 'push');
  }).catch(function () { setView('push'); });
})();

/* ---- installable app plumbing ---- */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}

/* keep the screen awake while a workout is running, where supported */
(function () {
  var lock = null;
  async function request() {
    try { if ('wakeLock' in navigator && !lock) lock = await navigator.wakeLock.request('screen'); } catch (e) {}
  }
  document.addEventListener('click', request, { once: true });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') { lock = null; request(); }
  });
})();
</script>
</body>
</html>
